<html>
<head>
    <title>Todo List</title>
</head>
<body>
    <h1>My Todo List</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="New task">
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for todo in todos %}
            <li>
                {% if todo.completed %}
                    <strike>{{ todo.title }}</strike>
                {% else %}
                    {{ todo.title }}
                {% endif %}
                
                <a href="{% url 'toggle_todo' todo.id %}">[✔]</a>
                <a href="{% url 'delete_todo' todo.id %}">[✘]</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
